[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xau-mt5-pa-bot"
version = "3.2.0"
description = "Auditable XAUUSD price-action and session-scout bot for MetaTrader 5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]
discord = ["discord.py>=2.3,<3"]

[project.scripts]
xau-mt5-bot = "xau_mt5_bot.main:cli"
xau-discord-bot = "xau_mt5_bot.discord_bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
