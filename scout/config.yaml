symbol: XAUUSD
display_timezone: Asia/Kolkata
poll_seconds: 3
history_bars:
  M1: 10000
  M5: 30000
  M15: 8000
  H1: 3000
  H4: 1200
  D1: 730
risk:
  pa_risk_percent: 0.25
  fixed_pa_lot: 0.01
  scout_lot: 0.01
  min_actual_rr: 1.0
  max_spread_price: 0.60
  emergency_scout_sl_price: 20.0
  max_total_volume: 1.0
  daily_max_loss_percent: 2.0
  max_consecutive_losses: 3
safety:
  # Legacy manual-only form of the broker offset, in seconds. Kept for compatibility and honoured
  # only when broker_utc_offset_hours below is null; 0 means "use auto-detection".
  broker_timestamp_offset_seconds: 0
  broker_offset_remeasure_seconds: 3600   # re-detect the server timezone at most this often
  allow_scout_orders: true      # session scout pairs on DEMO
  allow_pa_orders: false         # manual entries; demo scouts still enabled
  allow_live_account: false     # hard stop: never a live account
  require_hedging_for_scouts: true
  one_pa_position_per_symbol: true
  max_m1_age_seconds: 300
  retry_count: 1
  broker_market_stale_seconds: 180
  deal_history_max_days: 3650
  # null = auto-detect the MT5 server timezone from the tick clock (recommended).
  # Set a number only to pin it, e.g. 3 for a UTC+3 server: whole or half hours.
  broker_utc_offset_hours: null
  # Residual skew tolerated AFTER the broker offset is applied; above this, orders are blocked.
  max_clock_skew_seconds: 600
magic:
  scout_asia: 11001
  scout_london: 11002
  scout_new_york: 11003
  pa: 12001
sessions:
  asia_timezone: Asia/Tokyo
  asia_open: "09:00"
  london_timezone: Europe/London
  london_open: "08:00"
  new_york_timezone: America/New_York
  new_york_open: "08:00"
  new_york_close: "17:00"
  # Add broker holiday dates and special closes before each forward-test week.
  market_holidays: []
  market_early_closes: {}
analysis:
  atr_period: 14
  swing_left: 2
  swing_right: 2
  sweep_reclaim_bars: 3
  equal_level_atr_tolerance: 0.10
  displacement_atr: 1.20
  fvg_min_atr: 0.10
  trigger_expiry_m1_bars: 30
  zone_proximity_atr: 0.20
  min_confluence: 55
  pattern_lookback_days: 30
  pattern_scan_retry_seconds: 60
  min_strategy_sample_trades: 20
  max_trigger_detection_delay_seconds: 15
scout_analysis:
  slow_velocity_price_per_min: 0.03
  # Set true for ONE start when changing broker/symbol to zero the pace-calibration counter, then set back to false.
  reset_pace_calibration: false
  fast_velocity_price_per_min: 0.15
  strength_price_step: 1.0
  min_verdict_strength: 5
  strong_contradiction_strength: 8
  hold_when_slow: true
  velocity_window_minutes: 20
  session_open_grace_minutes: 15
  pace_min_observation_minutes: 5
  min_calibration_sessions: 20
  hold_before_calibrated: false
  fallback_usd_per_price_per_lot_by_symbol:
    XAUUSD: 100.0
reporting:
  # NORMALISED RESEARCH VALUES ONLY (demo-only bot). Used to compare sessions on a common 1-lot scale in reports;
  # they are not funded-account readiness, permission or risk limits and never enter the GO decision.
  research_reference_lot: 1.0
  research_daily_price_move: 5.0
  research_daily_usd: 500.0
  research_monthly_usd: 1500.0
  discord_scout_pair_min_interval_seconds: 60
session_target:
  # "$10 target" = a $10 XAUUSD PRICE movement in the setup direction during the current session, not $10 profit.
  enabled: true
  target_price_move: 10.0
  minimum_history_samples: 20
  achievable_probability_threshold: 0.60
  stretched_probability_threshold: 0.35
  minimum_remaining_minutes: 30
  block_when_unlikely: true
outcomes:
  enabled: true
  favourable_threshold: 5.0
  adverse_threshold: 3.0
  max_tracking_minutes: 480
  minimum_samples: 20
  min_level_samples: 5
  scope_to_fingerprint: false
intermarket:
  # v3.1.0 — XAU/XAG evidence. Silver never authorises an order; it adds at most max_weight confluence points while COUPLED.
  enabled: true
  symbol: XAGUSD
  timeframes: [M5, M15]
  bars: {M5: 600, M15: 300}
  correlation_bars: 60          # M5 log-return window for Pearson r (5 hours)
  coupled_correlation: 0.50
  weak_correlation: 0.20
  relative_strength_bars: 12    # 1 hour of M5
  leading_threshold_pct: 0.15   # silver must out/under-perform gold by 0.15 pp to count as leading
  smt_timeframe: M15
  swing_left: 2
  swing_right: 2
  smt_max_age_bars: 24
  smt_weight: 6
  leading_weight: 3
  max_weight: 8
  max_silver_age_seconds: 900
logging:
  sqlite_path: data/logs/trading.sqlite3
  jsonl_path: data/logs/analysis.jsonl

integrations:
  discord_webhook_env: DISCORD_WEBHOOK
  discord_min_interval_seconds: 300
  discord_status_mode: hourly   # hourly decision card + immediate decision changes
  discord_event_level: trade    # trade | all — session/scout/order/TP/close/error events only by default (v3.1.1)
  firebase_key_path: serviceAccountKey.json
  firestore_push_seconds: 300
  series_sample_seconds: 30
  telemetry_flush_seconds: 60
  discord_retry_count: 3
  discord_retry_backoff_seconds: 1.0
  firestore_series_max_points: 240
analysis_window_bars:   # bars handed to the detectors each cycle (history_bars is what is cached)
  M1: 600
  M5: 1200
  M15: 800
  H1: 600
  H4: 400
  D1: 400
management:
  breakeven_at_rr: 1.0
  breakeven_offset_price: 0.10
  trailing_atr: 0.0
  trailing_start_rr: 1.5
  partial_tp1_percent: 50
  partial_tp2_percent: 25
  close_pa_at_session_end: false
  setup_cooldown_minutes: 30
  max_entries_per_setup: 1
